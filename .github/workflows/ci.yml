name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-client:
    name: Client checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install client dependencies
        run: pnpm install --frozen-lockfile
        working-directory: client

      - name: Lint client
        run: pnpm lint
        working-directory: client

      - name: Build client
        run: pnpm build
        working-directory: client

  test-server:
    name: Server integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: todo_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d todo_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install server dependencies
        run: pnpm install --frozen-lockfile
        working-directory: server

      - name: Typecheck server
        run: pnpm typecheck
        working-directory: server

      - name: Build server
        run: pnpm build
        working-directory: server

      - name: Run server integration tests
        run: pnpm test
        working-directory: server
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/todo_test_db

  test-e2e:
    name: Full-stack end-to-end
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install client dependencies
        run: pnpm install --frozen-lockfile
        working-directory: client

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: client

      - name: Build test stack and run browser tests
        run: pnpm test:e2e

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: client/test-results/
          if-no-files-found: ignore
          retention-days: 7

  publish-images:
    name: Build & Publish GHCR Images
    runs-on: ubuntu-latest
    needs: [test-client, test-server, test-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta-client.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata for client image
        id: meta-client
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-client
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Build and push client image
        uses: docker/build-push-action@v7
        with:
          context: ./client
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for server image
        id: meta-server
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [publish-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    concurrency:
      group: production-ec2-deployment
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Authorize Runner IP in Security Group
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "Discovered runner public IP: $RUNNER_IP"
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.AWS_SG_ID }}" \
            --protocol tcp \
            --port 22 \
            --cidr "${RUNNER_IP}/32"
          echo "Successfully whitelisted $RUNNER_IP in Security Group ${{ secrets.AWS_SG_ID }}."

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Scan and record EC2 host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy production Compose contract to EC2
        run: |
          scp prod-compose.yaml ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/todo-app/prod-compose.yaml

      - name: Execute remote deployment & healthcheck
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "GHCR_TOKEN='$GHCR_TOKEN' GITHUB_ACTOR='$GITHUB_ACTOR' bash -s" << 'EOF'
            set -euo pipefail
            cd /opt/todo-app

            trap 'echo "Deployment failed, triggering rollback..."; if [ -f rollback.env ]; then cp rollback.env release.env; docker compose -f prod-compose.yaml --env-file release.env up -d; echo "Rolled back to previous known-good tag."; fi' ERR

            # 1. Preserve current tag for rollback
            if [ -f release.env ]; then
              cp release.env rollback.env
            fi

            # 2. Write new release SHA
            TAG="${{ needs.publish-images.outputs.image_tag }}"
            if [ -z "$TAG" ]; then
              TAG="sha-$(echo "${{ github.sha }}" | cut -c 1-7)"
            fi
            if grep -q '^IMAGE_TAG=' release.env 2>/dev/null; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$TAG/" release.env
            else
              echo "IMAGE_TAG=$TAG" >> release.env
            fi
            chmod 600 release.env

            # 3. Log in to GHCR
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # 4. Pre-pull images while current stack is still serving traffic
            docker compose -f prod-compose.yaml --env-file release.env pull

            # 5. Recreate containers with zero downtime
            docker compose -f prod-compose.yaml --env-file release.env up -d --remove-orphans

            # 6. Automated healthcheck polling (Tier 3 deep check)
            echo "Polling live application healthcheck..."
            for i in {1..12}; do
              if curl -sf http://localhost/api/health | grep -q '"status":"ok"'; then
                echo "Deployment successfully verified healthy!"
                exit 0
              fi
              echo "Waiting for stack to become healthy (attempt $i/12)..."
              sleep 5
            done

            echo "Healthcheck failed! Triggering automatic rollback..."
            if [ -f rollback.env ]; then
              cp rollback.env release.env
              docker compose -f prod-compose.yaml --env-file release.env up -d
              echo "Rolled back to previous known-good tag."
            fi
            exit 1
          EOF

      - name: Revoke Runner IP from Security Group
        if: always()
        run: |
          if [ -n "${RUNNER_IP:-}" ]; then
            echo "Revoking $RUNNER_IP from Security Group..."
            aws ec2 revoke-security-group-ingress \
              --group-id "${{ secrets.AWS_SG_ID }}" \
              --protocol tcp \
              --port 22 \
              --cidr "${RUNNER_IP}/32" || echo "Revoke completed or rule already gone."
            echo "Security Group successfully locked down."
          fi
