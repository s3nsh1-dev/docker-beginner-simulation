services:
  client:
    image: ghcr.io/${IMAGE_REPO:-s3nsh1-dev/docker-beginner-simulation}-client:${IMAGE_TAG:-latest}
    init: true
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  server:
    image: ghcr.io/${IMAGE_REPO:-s3nsh1-dev/docker-beginner-simulation}-server:${IMAGE_TAG:-latest}
    init: true
    restart: unless-stopped
    expose:
      - "5000"
    env_file:
      - ./server.env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:5000/api/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
