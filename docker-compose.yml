services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    init: true
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "3000:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  server:
    build: ./server
    init: true
    env_file:
      - ./server.env
    restart: unless-stopped
    expose:
      - "5000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:5000/api/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
