services:
  client:
    build:
      context: ./client
      dockerfile: ./client/Dockerfile
    depends_on: [server]
    restart: unless-stopped
    ports:
      - "3000:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules

  server:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      PORT: 5000
    networks: [client_server]
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules

volumes:
  client_node_modules:
  server_node_modules:
