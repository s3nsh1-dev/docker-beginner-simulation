services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    depends_on: [server]
    restart: unless-stopped
    ports:
      - "3000:5173"

  server:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      PORT: 5000
    restart: unless-stopped
    ports:
      - "5000:5000"
